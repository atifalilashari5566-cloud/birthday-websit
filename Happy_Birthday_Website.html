<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Happy Birthday</title>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#ff4e8b,#7b68ee,#00c6ff);color:#fff;text-align:center;overflow:hidden}
.container{margin-top:70px;position:relative;z-index:2}h1{font-size:56px}h2{font-size:34px}
button{padding:15px 28px;border:none;border-radius:30px;background:gold;font-size:20px;cursor:pointer}
.balloon{position:absolute;bottom:-120px;width:60px;height:80px;border-radius:50%;animation:f 8s linear infinite}
@keyframes f{to{transform:translateY(-120vh)}}
</style></head>
<body><div class="container">
<h1>🎉 Happy Birthday 🎉</h1><h2 id="person">Dear Friend ❤️</h2>
<p>May your life be filled with happiness, success and smiles!</p>
<button onclick="surprise()">🎁 Click for Surprise</button><h2 id="msg"></h2></div>
<script>
const p=new URLSearchParams(location.search),n=p.get("name");if(n)person.innerHTML="Dear "+n+" ❤️";
const c=["red","yellow","blue","green","orange","pink","purple"];
for(let i=0;i<20;i++){let b=document.createElement("div");b.className="balloon";b.style.left=Math.random()*100+"vw";b.style.background=c[Math.floor(Math.random()*c.length)];b.style.animationDuration=(5+Math.random()*5)+"s";document.body.appendChild(b);}
function surprise(){msg.innerHTML="🎂 Wishing you joy, good health and success. Happy Birthday! ❤️";alert("🎉 Happy Birthday!");}
</script></body></html>
